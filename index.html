<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Control de Acceso</title>

    <link
        rel="stylesheet"
        href="styles.css">

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

</head>

<body>

    <div class="app">

        <header>

            <h1 id="title"></h1>

            <span id="version"></span>

        </header>

        <main>

            <section id="scanner-container">

                <div id="qr-reader"></div>

            </section>

            <section id="status-card">

                <h2>Sistema listo</h2>

                <p>Esperando código QR...</p>

            </section>

            <div class="actions">

                <button
                    id="continue-btn"
                    onclick="resumeScanner()"
                    disabled>

                    Continuar escaneo

                </button>

            </div>

        </main>

    </div>

    <script src="app.js"></script>

</body>

</html>
